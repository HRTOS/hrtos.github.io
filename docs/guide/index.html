/* ==================================================
   4. 构建左侧导航树
   ================================================== */

function buildSidebar(filter = "") {
  navTree.replaceChildren();

  const keyword = filter.trim().toLowerCase();
  const groups = new Map();

  docs.forEach(doc => {
    const searchable = (
      doc.name + " " +
      doc.file + " " +
      doc.group + " " +
      doc.description
    ).toLowerCase();

    if (keyword && !searchable.includes(keyword)) {
      return;
    }

    if (!groups.has(doc.group)) {
      groups.set(doc.group, []);
    }

    groups.get(doc.group).push(doc);
  });

  if (groups.size === 0) {
    const empty = document.createElement("div");
    empty.className = "no-results";
    empty.textContent = "没有找到匹配的文档";
    navTree.appendChild(empty);
    return;
  }

  groups.forEach((items, groupName) => {
    const heading = document.createElement("div");
    heading.className = "group-title";
    heading.textContent = groupName;
    navTree.appendChild(heading);

    items.forEach(doc => {
      const item = document.createElement("div");
      item.className = "item";
      item.dataset.file = doc.file;
      item.title = doc.description;
      item.setAttribute("role", "button");
      item.setAttribute("tabindex", "0");

      const number = document.createElement("span");
      number.className = "item-number";
      number.textContent = doc.file.slice(0, 2);

      const label = document.createElement("span");
      label.textContent = doc.name;

      item.append(number, label);

      item.addEventListener("click", () => {
        openDoc(doc.file);
      });

      item.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openDoc(doc.file);
        }
      });

      navTree.appendChild(item);
    });
  });

  updateActiveItem();
}

function updateActiveItem() {
  navTree.querySelectorAll(".item").forEach(item => {
    const active = item.dataset.file === currentFile;
    item.classList.toggle("active", active);

    if (active) {
      item.setAttribute("aria-current", "page");
    } else {
      item.removeAttribute("aria-current");
    }
  });
}

    <div class="doc-list" id="homeDocList"></div>

    <div class="home-footer">
      HRTOS System Manual · 通过左侧目录或下方文档入口浏览内容
    </div>
  `;

  const cards = [
    {
      title: "内核系统",
      icon: "◈",
      description: "系统总览、内核概述、目录结构与启动流程",
      target: "00_README.md"
    },
    {
      title: "任务与调度",
      icon: "⚡",
      description: "任务生命周期、调度器与状态机",
      target: "04_task_management.md"
    },
    {
      title: "通信与同步",
      icon: "⇄",
      description: "等待、事件、信号量、互斥锁、队列与邮箱",
      target: "07_wait_design.md"
    },
    {
      title: "底层系统",
      icon: "▥",
      description: "定时系统、中断管理与内存布局",
      target: "13_timer_system.md"
    },
    {
      title: "架构与扩展",
      icon: "⇢",
      description: "调用流程、移植层、设计原则与扩展指南",
      target: "16_call_flow.md"
    },
    {
      title: "开发与调试",
      icon: "⌕",
      description: "内核运行检查、问题分析与调试方法",
      target: "20_debugging.md"
    }
  ];

  const cardContainer = inner.querySelector("#homeCards");

  cards.forEach(card => {
    const el = document.createElement("article");
    el.className = "card";
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");

    const icon = document.createElement("div");
    icon.className = "card-icon";
    icon.textContent = card.icon;

    const title = document.createElement("h3");
    title.textContent = card.title;

    const desc = document.createElement("p");
    desc.textContent = card.description;

    el.append(icon, title, desc);

    el.addEventListener("click", () => openDoc(card.target));

    el.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openDoc(card.target);
      }
    });

    cardContainer.appendChild(el);
  });

  const list = inner.querySelector("#homeDocList");

  docs.forEach(doc => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "doc-link";

    const number = document.createElement("span");
    number.className = "number";
    number.textContent = doc.file.slice(0, 2);

    const label = document.createElement("span");
    label.textContent = doc.name;

    button.append(number, label);
    button.title = doc.description;

    button.addEventListener("click", () => openDoc(doc.file));

    list.appendChild(button);
  });

  content.replaceChildren(inner);
}

/* ==================================================
   6. 加载 Markdown 文档
   ================================================== */

async function openDoc(file, options = {}) {
  const doc = docByFile.get(file);

  if (!doc) {
    showError("找不到对应的文档配置：" + file);
    return;
  }

  const { updateHash = true } = options;

  const thisRequest = ++requestId;

  currentFile = file;
  updateActiveItem();

  if (updateHash) {
    const hash = "#" + encodeURIComponent(file);
    if (location.hash !== hash) {
      history.pushState(null, "", hash);
    }
  }

  const inner = document.createElement("div");
  inner.className = "content-inner";

  const status = document.createElement("div");
  status.className = "status";
  status.textContent = "正在加载：" + doc.name + "...";

  inner.appendChild(status);
  content.replaceChildren(inner);

  try {
    const response = await fetch(
      "./" + encodeURIComponent(file),
      { cache: "no-cache" }
    );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status + " " + response.statusText
      );
    }

    const markdown = await response.text();

    if (thisRequest !== requestId) {
      return;
    }

    if (typeof marked === "undefined") {
      throw new Error("Markdown 渲染库加载失败，请检查网络连接");
    }

    const article = document.createElement("article");
    article.className = "content-inner";

    /*
     * Markdown 文件必须是可信的站点内容。
     * 如果文档允许第三方提交内容，生产环境应增加 HTML 清洗。
     */
    article.innerHTML = marked.parse(markdown);

    content.replaceChildren(article);

    document.title = doc.name + " - HRTOS 系统手册";

    // 每次切换文档，回到正文顶部。
    content.scrollTop = 0;

  } catch (error) {
    if (thisRequest !== requestId) {
      return;
    }

    showError(
      "文档加载失败：" + doc.name,
      error.message,
      () => openDoc(file)
    );
  }
}

/* ==================================================
   7. 加载失败提示
   ================================================== */

function showError(title, detail = "", retry = null) {
  const inner = document.createElement("div");
  inner.className = "content-inner";

  const heading = document.createElement("h2");
  heading.style.color = "#fca5a5";
  heading.textContent = title;

  const message = document.createElement("p");
  message.className = "status error";
  message.textContent = detail || "请检查 Markdown 文件是否存在。";

  inner.append(heading, message);

  if (retry) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "重新加载";
    button.addEventListener("click", retry);
    message.appendChild(document.createElement("br"));
    message.appendChild(button);
  }

  content.replaceChildren(inner);
}

/* ==================================================
   8. URL 哈希与浏览器历史记录
   ================================================== */

function loadFromHash() {
  const rawHash = location.hash.slice(1);

  if (!rawHash) {
    requestId++;
    currentFile = null;
    document.title = "HRTOS 系统手册";
    showHome();
    return;
  }

  let hash;

  try {
    hash = decodeURIComponent(rawHash);
  } catch {
    hash = rawHash;
  }

  // 兼容旧版使用不带 .md 的文件名哈希。
  let doc = docByFile.get(hash);

  if (!doc) {
    doc = docs.find(item =>
      item.file.replace(/\.md$/i, "") === hash
    );
  }

  if (doc) {
    openDoc(doc.file, { updateHash: false });
  } else {
    requestId++;
    currentFile = null;
    document.title = "HRTOS 系统手册";
    showHome();
  }
}

window.addEventListener("hashchange", loadFromHash);
window.addEventListener("popstate", loadFromHash);

searchInput.addEventListener("input", event => {
  buildSidebar(event.target.value);
});

buildSidebar();
loadFromHash();
